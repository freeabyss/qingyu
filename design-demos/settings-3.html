<!DOCTYPE html>
<html lang="zh-Hans"><head><meta charset="utf-8"><title>清羽 · 设置 · 方向三 玻璃</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:920px;height:640px;overflow:hidden;color:#fff;position:relative;
  font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wallpaper{position:absolute;inset:0;background:
  radial-gradient(700px 600px at 10% 6%,#FF8A5B 0%,rgba(255,138,91,0) 60%),
  radial-gradient(800px 700px at 92% 10%,#F45FA8 0%,rgba(244,95,168,0) 58%),
  radial-gradient(900px 800px at 74% 96%,#4B62E8 0%,rgba(75,98,232,0) 60%),
  radial-gradient(700px 600px at 6% 96%,#8A5BE0 0%,rgba(138,91,224,0) 60%),
  linear-gradient(135deg,#F2725A,#D8559B 34%,#7A5AD8 66%,#3C5FD6)}
.wallpaper::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12)}
.win{position:absolute;inset:0;display:flex;
  background:rgba(16,9,34,.62);
  -webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%)}
.win::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 32%)}
.side{width:200px;border-right:1px solid rgba(255,255,255,.18);padding:20px 0;position:relative;z-index:1}
.brand{padding:0 16px 18px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.75}
.it{margin:2px 8px;padding:7px 10px;border-radius:10px;font-size:12.5px}
.it.on{background:rgba(255,255,255,.18);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.grp{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.65;padding:14px 16px 5px}
.main{flex:1;padding:24px 30px;position:relative;z-index:1;overflow:hidden}
h1{font-size:25px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:11.5px;opacity:.85;margin-top:5px}
.sec{margin-top:18px}
.sec-h{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:12.5px}
.row .name{font-weight:600}
.row .meta{font-size:10px;opacity:.75}
.row .fill{flex:1}
.row .st{font-size:10px;opacity:.9}
.row .st.run{color:#9BE8B0}
.row .st.err{color:#FFB4AB}
.sw{width:34px;height:19px;border-radius:999px;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.34);position:relative;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:#fff;border-color:#fff}
.sw.on i{left:auto;right:2px;background:#F45FA8}
.seg{display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px}
.seg span{padding:3px 11px;font-size:10.5px;border-radius:999px;opacity:.85}
.seg span.on{background:#fff;color:#2B1F4E;font-weight:600;opacity:1}
.btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;color:#fff;
  padding:5px 12px;font-size:10.5px;font-weight:600}
</style></head>
<body>
<div class="wallpaper"></div>
<div class="win">
  <div class="side">
    <div class="brand">Qingyu</div>
    <div class="it on">通用</div>
    <div class="grp">功能列表</div>
    <div class="it">快速启动</div>
    <div class="it">剪贴板</div>
    <div class="it">截图</div>
    <div class="grp">&nbsp;</div>
    <div class="it">关于</div>
  </div>
  <div class="main">
    <h1>通用</h1>
    <div class="sub">插件管理、外观、语言、数据与权限</div>

    <div class="sec"><div class="sec-h">插件管理</div>
      <div class="row"><span class="name">快速启动</span><span class="meta">1.0.0</span><span class="fill"></span><span class="st run">运行中</span><span class="sw on"><i></i></span></div>
      <div class="row"><span class="name">剪贴板</span><span class="meta">1.0.0</span><span class="fill"></span><span class="st run">运行中</span><span class="sw on"><i></i></span></div>
      <div class="row"><span class="name">截图</span><span class="meta">1.0.0</span><span class="fill"></span><span class="st err">权限未授予</span><button class="btn">重试</button><span class="sw"><i></i></span></div>
    </div>

    <div class="sec"><div class="sec-h">外观</div>
      <div class="row"><span class="name">主题</span><span class="fill"></span>
        <div class="seg"><span class="on">跟随系统</span><span>浅色</span><span>深色</span></div></div>
      <div class="row"><span class="name">语言</span><span class="fill"></span>
        <div class="seg"><span class="on">跟随系统</span><span>简体中文</span><span>English</span></div></div>
    </div>

    <div class="sec"><div class="sec-h">数据</div>
      <div class="row"><span class="name">本地数据</span><span class="fill"></span><span class="meta">128.4 MB</span><button class="btn">打开数据目录</button></div>
    </div>

    <div class="sec"><div class="sec-h">权限</div>
      <div class="row"><span class="name">屏幕录制</span><span class="fill"></span><span class="st run">已授权</span></div>
      <div class="row"><span class="name">辅助功能</span><span class="fill"></span><span class="st run">已授权</span></div>
    </div>
  </div>
</div>
</body></html>
