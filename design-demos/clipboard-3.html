<!DOCTYPE html>
<html lang="zh-Hans"><head><meta charset="utf-8"><title>清羽 · 剪贴板历史 · 方向三 玻璃</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:860px;height:520px;overflow:hidden;color:#fff;position:relative;
  font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wallpaper{position:absolute;inset:0;background:
  radial-gradient(620px 520px at 8% 4%,#FF8A5B 0%,rgba(255,138,91,0) 60%),
  radial-gradient(700px 600px at 94% 8%,#F45FA8 0%,rgba(244,95,168,0) 58%),
  radial-gradient(760px 680px at 78% 98%,#4B62E8 0%,rgba(75,98,232,0) 60%),
  radial-gradient(600px 520px at 4% 98%,#8A5BE0 0%,rgba(138,91,224,0) 60%),
  linear-gradient(135deg,#F2725A,#D8559B 34%,#7A5AD8 66%,#3C5FD6)}
.wallpaper::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12)}
.win{position:absolute;inset:0;background:rgba(13,7,28,.78);
  -webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);
  display:flex;flex-direction:column}
.win::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 30%)}

/* 顶部 */
.top{padding:14px 18px 0;border-bottom:1px solid rgba(255,255,255,.16);position:relative;z-index:1}
.search{display:flex;align-items:center;gap:9px;padding-bottom:11px}
.search svg{opacity:.7;flex:none}
.search .ph{font-size:13px;opacity:.68}
.tabs{display:flex;gap:22px;padding:0 2px}
.tab{padding:0 0 9px;font-size:12px;opacity:.62;position:relative}
.tab.on{opacity:1;font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#fff;border-radius:2px}
.pause{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;opacity:.72;padding-bottom:9px}

/* 主体 */
.body{flex:1;display:flex;min-height:0;align-items:stretch;position:relative;z-index:1}
.list{width:499px;border-right:1px solid rgba(255,255,255,.16);overflow:hidden;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:9px;padding:8px 8px 8px 10px;border-bottom:1px solid rgba(255,255,255,.10)}
.row.sel{background:rgba(255,255,255,.10);box-shadow:inset 2px 0 0 #fff}
.row.hov{background:rgba(255,255,255,.06)}
.th{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.22);flex:none;
    display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.18)}
.th.img{background:linear-gradient(135deg,#8FD3FF,#B9A8FF);color:#2B1F4E}
.th.file{background:rgba(255,255,255,.30);color:#2B1F4E}
.th.color{background:#4A6CB0;color:#fff}
.txt{min-width:0;flex:1}
.t1{font-size:12.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:10px;opacity:.72;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 行内动作 + 键位角标 */
.acts{display:flex;align-items:center;gap:2px;flex:none}
.act{position:relative;width:28px;height:26px;border-radius:7px;border:none;background:transparent;color:#fff;
     display:grid;place-items:center;opacity:.82}
.act:hover{background:rgba(255,255,255,.18);opacity:1}
.act.pinned{opacity:1;background:rgba(255,255,255,.16)}
/* 详情 */
.detail{flex:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;align-self:stretch}
.dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.16)}
.dh .ty{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.86}
.dh .when{font-size:10px;opacity:.72}
.dbody{min-height:0;padding:15px 17px;font-size:12.5px;line-height:1.85;overflow:hidden}
.dbody .lead{font-weight:700}
.dfoot{border-top:1px solid rgba(255,255,255,.16);padding:8px 16px;display:flex;gap:16px;font-size:10px;opacity:.86}

/* 底部快捷键提示条 */
.keys{display:flex;align-items:center;gap:16px;padding:7px 16px;border-top:1px solid rgba(255,255,255,.18);
      position:relative;z-index:1;background:rgba(255,255,255,.04)}
.kk{display:flex;align-items:center;gap:5px;font-size:10.5px;opacity:.92}
.kc{display:inline-grid;place-items:center;min-width:19px;height:16px;padding:0 4px;border-radius:4px;
    background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.26);
    font-size:9.5px;font-weight:700;line-height:1}
.kk.dim{opacity:.5}
.ref{margin-left:auto;font-size:9.5px;opacity:.46;letter-spacing:.02em}
</style></head>
<body>
