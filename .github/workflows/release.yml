name: Release

# 生成通用二进制（Apple 芯片 + Intel）DMG，上传到 GitHub Release。
#
# 两种模式（自动判定）：
#   1. Developer ID 模式：仓库配置了签名 Secrets 时，正式签名 + 公证；
#   2. ad-hoc 免费模式：未配置证书 Secrets 时，自动 ad-hoc 签名、不公证。
#      用户首次打开需右键 →「打开」，或执行：
#        xattr -dr com.apple.quarantine /Applications/Qingyu.app
#
# 触发方式：
#   1. 推送形如 v0.3.40 的 tag；
#   2. 手动 workflow_dispatch，并填写 tag。
#
# Developer ID 模式需要配置的仓库 Secrets：
#   DEVELOPER_ID_APP                 Developer ID Application 证书名
#   DEVELOPER_ID_APP_CERT_P12_BASE64 导出为 .p12 后 base64 编码的证书
#   DEVELOPER_ID_APP_CERT_PASSWORD   .p12 密码
#   KEYCHAIN_PASSWORD                临时 keychain 密码（任意随机字符串）
#   APPLE_ID                         Apple 开发者账号
#   APPLE_TEAM_ID                    Team ID
#   APPLE_APP_PASSWORD               App 专用密码（notarytool）
# 以上缺失时自动降级为 ad-hoc 免费模式，无需任何 Secrets。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例如 v0.3.40）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag and version
        id: meta
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Qingyu/Info.plist)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Secrets 不能用于 if 条件，先经 env 暴露再判定签名模式。
      - name: Determine signing mode
        id: signing
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${DEVELOPER_ID_APP}" && -n "${DEVELOPER_ID_APP_CERT_P12_BASE64}" ]]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "签名模式：Developer ID（签名 + 公证）"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "签名模式：ad-hoc（免费、不公证）"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo -n "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build, sign, notarize and package DMG
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ./scripts/package-release.sh --require-notarize

      - name: Build and package DMG (ad-hoc, free)
        if: steps.signing.outputs.mode == 'adhoc'
        run: |
          set -euo pipefail
          ./scripts/package-release.sh --adhoc

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES="见 [CHANGELOG.md](https://github.com/freeabyss/qingyu/blob/main/CHANGELOG.md)。"
          if [[ "${SIGNING_MODE}" == "adhoc" ]]; then
            NOTES="${NOTES}

          > ⚠️ 本版本为 ad-hoc 免费构建，未经 Apple 公证。首次打开请右键 →「打开」，或执行 \`xattr -dr com.apple.quarantine /Applications/Qingyu.app\`。"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.sha256 \
              --title "清羽 Qingyu ${VERSION}" \
              --notes "$NOTES"
          fi
